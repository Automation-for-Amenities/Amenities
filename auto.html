<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation Website</title>
    <link rel="stylesheet" href="automa.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body>
    <div class="bg-container">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="d-flex flex-row justify-content-center pa">
                        <div class="contain">
                            <img
                            src="https://ik.imagekit.io/es6uep56h/Automation%20for%20Amenities%20Logo.png"
                            class="im"
                            alt="Automation Logo">
                            <h1 class="login-title">
                                Welcome Back!
                            </h1>
                            <p class="subtitle">
                                Enter your details to continue
                            </p>
                            <form>
                                <div class="form-group">
                                    <label for="Name">
                                        Name
                                    </label>
                                    <input
                                    type="text"
                                    placeholder="Enter your name"
                                    id="Name"
                                    name="name"
                                    required>
                                </div>
                                <div class="form-group">
                                    <label for="Roll">
                                        Roll Number
                                    </label>
                                    <input
                                    type="text"
                                    placeholder="Enter your roll number"
                                    id="Roll"
                                    name="roll"
                                    required>
                                </div>
                                <div class="form-group">
                                    <label for="Depart">
                                        Department
                                    </label>
                                    <input
                                    type="text"
                                    placeholder="Enter your department"
                                    id="Depart"
                                    name="department"
                                    required>
                                </div>
                                <button
                                class="button"
                                type="submit">
                                    Login <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
